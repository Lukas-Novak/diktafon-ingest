services:
  diktafon-ingest:
    build: .
    container_name: diktafon-ingest
    restart: always
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
    ports:
      # Localhost only — a TLS-terminating reverse proxy fronts this service.
      - "127.0.0.1:8378:8378"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8378/diktafon/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
